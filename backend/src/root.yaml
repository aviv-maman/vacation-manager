openapi: 3.0.3
info:
  title: Vacation Manager API
  version: 1.0.0
paths:
  /auth/login:
    post:
      x-handler: handlers/auth#login
      x-inputParser: handlers/auth#parseLoginInput
      summary: Log in with a seeded account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Signed token and safe user profile
        "400":
          description: Invalid input
        "401":
          description: Invalid email or password
  /auth/me:
    get:
      x-handler: handlers/auth#getMe
      summary: Return the current user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
        "401":
          description: Authentication required
  /vacation-requests:
    post:
      x-handler: handlers/vacations#createVacation
      x-inputParser: handlers/vacations#parseCreateInput
      summary: Submit a vacation request as the authenticated Requester
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                reason:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Pending vacation request created
        "400":
          description: Invalid dates or input
        "401":
          description: Authentication required
        "403":
          description: Requester role required
        "409":
          description: Overlapping Pending or Approved request
  /vacation-requests/:id/approve:
    post:
      x-handler: handlers/vacations#approveVacation
      x-inputParser: handlers/vacations#parseDecisionInput
      summary: Approve a Pending request as a Validator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Request approved
        "400":
          description: Invalid request ID
        "401":
          description: Authentication required
        "403":
          description: Validator role required
        "404":
          description: Vacation request not found
        "409":
          description: Request is already final
  /vacation-requests/:id/reject:
    post:
      x-handler: handlers/vacations#rejectVacation
      x-inputParser: handlers/vacations#parseRejectInput
      summary: Reject a Pending request with a nonblank comment as a Validator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comments]
              properties:
                comments:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Request rejected
        "400":
          description: Invalid request ID or missing rejection comment
        "401":
          description: Authentication required
        "403":
          description: Validator role required
        "404":
          description: Vacation request not found
        "409":
          description: Request is already final
  /health:
    get:
      x-handler: handlers/health#getHealth
      summary: Verify PostgreSQL connectivity and TypeORM entity loading
      responses:
        "200":
          description: Database connected and entity metadata loaded
        "503":
          description: Database unavailable
components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
